name: ORB bot

on:
  schedule:
    # Several start times, all UTC, so a late or skipped trigger doesn't matter.
    # The first one that starts stays running and scans every 5 minutes by itself.
    # Extra triggers wait in the queue (or show as cancelled); that is expected.
    - cron: "5,25,45 12-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: orb-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Get the data branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data --single-branch "$REPO_URL" data-out
          else
            mkdir data-out && cd data-out && git init -q -b data && git remote add origin "$REPO_URL"
          fi
          git -C data-out config user.name "orb-bot"
          git -C data-out config user.email "orb-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan every 5 minutes until the close
        env:
          DATA_DIR: data-out
          PUSH_DATA: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot/orb_bot.py --loop 340
