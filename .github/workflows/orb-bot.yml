name: ORB bot

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: orb-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Get the data branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data --single-branch "$REPO_URL" data-out
          else
            mkdir data-out && cd data-out && git init -q -b data && git remote add origin "$REPO_URL"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        env:
          DATA_DIR: data-out
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot/orb_bot.py

      - name: Save results
        working-directory: data-out
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "scan $(date -u +%H:%M)"
          git push -q origin data
